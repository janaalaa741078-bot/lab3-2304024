<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Author</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5" style="max-width: 600px;">
        <div class="card shadow-sm">
            <div class="card-body">
                <h2 class="mb-4">Edit Author</h2>
                <form method="POST" enctype="multipart/form-data">
                    <div class="mb-3">
                        <label class="form-label">Author Name</label>
                        <input type="text" name="name" class="form-control" value="{{ author.name }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Country</label>
                        <input type="text" name="country" class="form-control" value="{{ author.country }}">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Author Image</label>
                        {% if author.image %}
                            <div class="mb-2">
                                <img src="{{ url_for('static', filename='uploads/' + author.image) }}" width="60" height="60" class="rounded-circle" style="object-fit: cover;">
                            </div>
                        {% endif %}
                        <input type="file" name="image" class="form-control">
                    </div>
                    <button type="submit" class="btn btn-primary">Update Author</button>
                    <a href="{{ url_for('library') }}" class="btn btn-secondary">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
