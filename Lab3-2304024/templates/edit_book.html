<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Book</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5" style="max-width: 600px;">
        <div class="card shadow-sm">
            <div class="card-body">
                <h2 class="mb-4">Edit Book</h2>
                
                {% set b_id = book.book_id if book.book_id is defined else book.id %}
                
                <form method="POST" enctype="multipart/form-data">
                    <div class="mb-3">
                        <label class="form-label">Book ID</label>
                        <input type="number" class="form-control" value="{{ b_id }}" disabled>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Book Title</label>
                        <input type="text" name="title" class="form-control" value="{{ book.title }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Author</label>
                        <select name="author_id" class="form-control" required>
                            {% for author in authors %}
                                {% set a_id = author.author_id if author.author_id is defined else author.id %}
                                <option value="{{ a_id }}" {% if book.author_id == a_id %}selected{% endif %}>
                                    {{ author.name }}
                                </option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Price</label>
                        <input type="number" step="0.01" name="price" class="form-control" value="{{ book.price }}">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Book Cover Image</label>
                        {% if book.image %}
                            <div class="mb-2">
                                <img src="{{ url_for('static', filename='uploads/' + book.image) }}" width="45" height="60" style="object-fit: cover;">
                            </div>
                        {% endif %}
                        <input type="file" name="image" class="form-control">
                    </div>
                    <button type="submit" class="btn btn-primary">Update Book</button>
                    <a href="{{ url_for('library') }}" class="btn btn-secondary">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
